schemaVersion: 2

protocolV2:
  remoteBudget:
    preset: { remoteCalls: 80, nodes: 20000, bytes: 67108864, wallTimeMs: 900000, probeCalls: 10 }
    model: { remoteCalls: 80, nodes: 20000, bytes: 67108864, wallTimeMs: 900000, probeCalls: 10 }
  localQueryBudget: { calls: 200, rows: 50000, wallTimeMs: 300000 }
  externalIntelBudget: { calls: 100, iocs: 1000, wallTimeMs: 300000 }
  dataPolicy: { modelContentBytes: 4194304, evidenceBytes: 268435456, defaultTextClass: SENSITIVE_TEXT }
  grants: { maxRequests: 20, pendingExpiresOnInterruption: true }

agent:
  maxTurns: 30
  contextRetainTurns: 3
  providerMaxRetries: 2
  providerTimeoutSeconds: 600
  defaultMode: SCAN
  promptVersion: huntwarden-agent-v2

model:
  source: builtin
  provider: openai
  model: gpt-5.6-terra
  thinkingLevel: medium

executor:
  type: ssh
  timeoutSeconds: 30
  helperPath: /usr/local/libexec/huntwarden-helper
  knownHostsPath: ./labs/.lab-state/known_hosts
  privateKeyPath: ./labs/.lab-state/id_ed25519

storage:
  baseDir: ./data
  databaseFile: runtime.db

llmData:
  maxTextBytes: 65536

webshell:
  modifiedWithinHours: 168
  maxCandidateFiles: 500
  maxFileSizeBytes: 10485760
  maxScriptExcerptBytes: 65536
  maxAccessLogLines: 500
  yaraRuleDir: ./rules/yara

java:
  supportedContainers: [tomcat]
  allowClassDump: true
  allowRuntimeModification: false
  probeJar: ./java/tomcat-probe/build/libs/huntwarden-tomcat-probe.jar

account:
  checkAuthorizedKeys: true
  checkLoginHistory: true
  maxLoginHistoryEntries: 100

persistence:
  maxItemsPerSource: 500
  includeUserScope: true

triage:
  maxProcesses: 2000
  maxConnections: 5000
  maxFiles: 5000
  maxTimelineEvents: 5000
  maxArtifactBytes: 10485760
  maxProcessTreeDepth: 12

threatIntel:
  enabled: false
  provider: dbapp-ti
  baseUrl: https://ti.dbappsecurity.com.cn/oapi/v1/
  apiKeyEnv: DBAPP_TI_API_KEY
  timeoutSeconds: 15
  maxBatchSize: 100
  cacheTtlSeconds: 3600
  autoEnrichConnections: true
  includePrivateAddresses: false

remediation:
  requireApproval: true
  allowedTools: [quarantine_file, disable_account]
  quarantineRoot: /var/lib/huntwarden/quarantine
