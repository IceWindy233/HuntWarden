agent:
  maxTurns: 30
  maxToolCalls: 100
  defaultMode: SCAN
  promptVersion: huntwarden-agent-v1

model:
  source: builtin
  provider: deepseek
  model: deepseek-v4-flash
  thinkingLevel: high

executor:
  type: ssh
  timeoutSeconds: 30
  helperPath: /usr/local/libexec/huntwarden-helper
  knownHostsPath: ./labs/.lab-state/known_hosts
  privateKeyPath: ./labs/.lab-state/id_ed25519

storage:
  baseDir: ./data
  databaseFile: runtime.db

llmData:
  maxTextBytes: 65536

webshell:
  modifiedWithinHours: 168
  maxCandidateFiles: 500
  maxFileSizeBytes: 10485760
  yaraRuleDir: ./rules/yara

java:
  supportedContainers: [tomcat]
  allowClassDump: true
  allowRuntimeModification: false
  probeJar: ./java/tomcat-probe/build/libs/huntwarden-tomcat-probe.jar

account:
  checkAuthorizedKeys: true
  checkLoginHistory: true

persistence:
  maxItemsPerSource: 500
  includeUserScope: true
  maxConnections: 500

triage:
  maxProcesses: 2000
  maxConnections: 5000
  maxFiles: 10000
  maxTimelineEvents: 10000
  maxArtifactBytes: 10485760

threatIntel:
  enabled: false
  provider: dbapp-ti
  baseUrl: https://ti.dbappsecurity.com.cn/oapi/v1/
  apiKeyEnv: DBAPP_TI_API_KEY
  timeoutSeconds: 15
  maxBatchSize: 100
  cacheTtlSeconds: 3600
  autoEnrichConnections: true
  includePrivateAddresses: false

remediation:
  requireApproval: true
  allowedTools: [quarantine_file, disable_account]
  quarantineRoot: /var/lib/huntwarden/quarantine
