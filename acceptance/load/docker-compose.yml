services:
  target:
    build:
      context: ../..
      dockerfile: acceptance/load/Dockerfile
    container_name: huntwarden-load-target
    environment:
      HUNTWARDEN_LOAD_PROCESS_COUNT: ${HUNTWARDEN_LOAD_PROCESS_COUNT:-1000}
      HUNTWARDEN_LOAD_FILE_COUNT: ${HUNTWARDEN_LOAD_FILE_COUNT:-100000}
      HUNTWARDEN_LOAD_LOG_COUNT: ${HUNTWARDEN_LOAD_LOG_COUNT:-100000}
    pids_limit: 12050
    ports:
      - "127.0.0.1:2300:22"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/huntwarden-load-processes.ready && test -s /run/huntwarden-load-files.ready && test -s /run/huntwarden-load-logs.ready"]
      interval: 2s
      timeout: 2s
      retries: 90
