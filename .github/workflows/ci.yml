name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    # Split out of `npm run build` on purpose. `build:core` type-checks the same
    # tsconfig.json project, but only as a side effect of emitting into dist/, and it
    # sits behind a 25-minute job. A dedicated --noEmit job fails within a minute, runs
    # in parallel and keeps the type contract an explicit gate rather than a byproduct
    # of whichever bundler `build` happens to use (preload and renderer already moved
    # to esbuild/vite, which strip types without checking them).
    #
    # `npm run typecheck:renderer` (tsconfig.renderer.json) is wired in below. Neither
    # `build:renderer` (vite) nor `build:preload` (esbuild) checks types, so without this
    # step the entire renderer had no type gate at all — it had accumulated 15 unnoticed
    # errors before this job existed.
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck renderer
        run: npm run typecheck:renderer

  build-and-test:
    # `npm test` runs vitest over tests/**, which includes the mandatory write-action
    # and crash-recovery invariants in tests/unit/remediation-invariants.test.ts and
    # tests/unit/recovery-invariants.test.ts. Those two files need neither Docker,
    # Electron nor real SSH, so no extra job is required to make them mandatory.
    name: Build, test and Java probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
          package-manager-cache: true

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm run audit:prod

      - name: Check patch formatting
        run: git diff --check

      - name: Build application
        run: npm run build

      - name: Run default test suite
        run: npm test

      - name: Build Tomcat probe
        run: npm run probe:build
